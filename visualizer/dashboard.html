<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIP-X Dashboard | RIP vs RIP-X</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <style>
    /* ---- dark console theme: charcoal base, sky-blue highlight, royal-blue panels (plain CSS, no dependencies) ---- */
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root {
      --bg: #1E1E1E; --panel: #282828; --ink: #F1F1F1; --dim: rgba(241,241,241,.68); --faint: rgba(241,241,241,.46);
      --sky: #6BB5E4; --royal: #3A4DA1; --red: #FF6B7A;
      --cy: #6BB5E4; --mg: #3A4DA1; --mute: rgba(241,241,241,.68);
      --font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --cyber: var(--font);
      --glow: 0 0 10px rgba(107,181,228,.45); --glow-soft: 0 10px 30px -12px rgba(107,181,228,.5);
    }
    * { box-sizing: border-box; }
    body { overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--ink); font: 400 13.5px/1.55 var(--font); }
    /* faint grid, royal haze, vignette; scanlines over everything */
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(58,77,161,.38), transparent 55%),
        radial-gradient(ellipse at 92% 104%, rgba(107,181,228,.12), transparent 50%),
        radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%),
        linear-gradient(rgba(107,181,228,.05) 1px, transparent 1px) 0 0 / 100% 46px,
        linear-gradient(90deg, rgba(107,181,228,.05) 1px, transparent 1px) 0 0 / 46px 100%; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 1px, transparent 1px 3px); }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
    nav { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    nav h1 { font: 700 30px/1.15 var(--font); flex: 1; letter-spacing: -.01em; }
    nav h1::before { content: ">"; color: var(--sky); margin-right: 12px; }
    nav a { color: var(--sky); text-decoration: none; font-size: 13px; transition: text-shadow .2s; }
    nav a:hover { text-shadow: var(--glow); }
    .engine { font-size: 12px; color: var(--red); margin-left: 14px; font-weight: 500; }
    .cursor { display: inline-block; width: .55em; height: 1em; margin-left: 6px; background: var(--sky); vertical-align: -3px; border-radius: 2px; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* glitch title */
    .glitch { position: relative; color: var(--ink); }
    .glitch::before, .glitch::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; }
    .glitch::before { color: var(--sky); transform: translate(-2px, 0); clip-path: inset(0 0 60% 0); animation: glitch 3.6s steps(1) infinite; }
    .glitch::after { color: var(--royal); transform: translate(2px, 0); clip-path: inset(60% 0 0 0); animation: glitch 3.6s steps(1) infinite reverse; }
    @keyframes glitch { 0%,90%,100% { opacity: 0; } 91% { opacity: .95; transform: translate(-3px,1px); } 93% { opacity: .95; transform: translate(3px,-1px); } 95% { opacity: 0; } }

    /* HUD panels: rounded, gradient edge, corner brackets */
    section { position: relative; background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(135deg, var(--sky), var(--royal) 45%, rgba(58,77,161,.45)) border-box;
      border: 1.5px solid transparent; border-radius: 18px; padding: 22px; margin-bottom: 26px; box-shadow: var(--glow-soft); }
    section::after { content: ""; position: absolute; inset: 8px; pointer-events: none; --b: var(--sky);
      background: linear-gradient(var(--b), var(--b)) 0 0 / 16px 2.5px no-repeat, linear-gradient(var(--b), var(--b)) 0 0 / 2.5px 16px no-repeat,
                  linear-gradient(var(--b), var(--b)) 100% 100% / 16px 2.5px no-repeat, linear-gradient(var(--b), var(--b)) 100% 100% / 2.5px 16px no-repeat; }
    section h2 { display: flex; align-items: center; gap: 12px; font: 700 17px var(--font); margin-bottom: 14px; color: var(--ink); }
    section h2::before { content: ">"; color: var(--sky); }
    section h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--royal), transparent); }
    .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 16px; }
    label { font: 600 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; gap: 8px; align-items: center; }

    /* neon-style steppers and buttons */
    .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--royal); border-radius: 10px; background: linear-gradient(180deg, rgba(107,181,228,.1), rgba(107,181,228,.02)); overflow: hidden; transition: box-shadow .2s, border-color .2s; }
    .stepper:hover { border-color: var(--sky); }
    .stepper:focus-within { border-color: var(--sky); box-shadow: 0 0 0 1px var(--sky), 0 0 16px rgba(107,181,228,.5); }
    input[type=number] { width: 54px; background: transparent; color: var(--ink); border: 0; padding: 7px 4px; text-align: center; font: 700 15px var(--font); -moz-appearance: textfield; caret-color: var(--sky); outline: none; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .stepper button { width: 28px; background: transparent; border: 0; color: var(--sky); font: 700 15px var(--font); cursor: pointer; transition: background .15s, color .15s; }
    .stepper button:first-child { border-right: 1px solid rgba(58,77,161,.7); } .stepper button:last-child { border-left: 1px solid rgba(58,77,161,.7); }
    .stepper button:hover { background: var(--royal); color: var(--ink); }
    button.go { background: var(--sky); color: #1E1E1E; border: 0; border-radius: 10px; padding: 10px 20px; font: 700 12px var(--font); letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
      box-shadow: var(--glow); transition: transform .12s, box-shadow .2s, filter .2s; }
    button.go:hover { transform: translateY(-1px); box-shadow: 0 0 18px rgba(107,181,228,.8); filter: brightness(1.08); }
    button.go:disabled { opacity: .5; cursor: wait; box-shadow: none; transform: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

    /* ---- KPI tiles: rotating edge, spotlight + tilt, count-up, gauge, before/after bars ---- */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(166px, 1fr)); gap: 14px; margin-bottom: 18px; perspective: 900px; }
    .kpi { --c: var(--sky); --mx: 50%; --my: 0%; --rx: 0deg; --ry: 0deg; position: relative; isolation: isolate; border-radius: 12px; padding: 14px 15px 12px;
      background: linear-gradient(160deg, rgba(58,77,161,.18), rgba(30,30,30,.7)); transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d;
      transition: transform .18s ease-out; animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i, 0) * 70ms); }
    .kpi.bad { --c: var(--red); animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both, alarm 2.2s ease-in-out 1s infinite; animation-delay: calc(var(--i, 0) * 70ms), 1s; }
    .kpi::before { content: ""; position: absolute; inset: -1.5px; z-index: -1; border-radius: 13.5px; padding: 1.5px;
      background: conic-gradient(from var(--a), rgba(58,77,161,.55) 0 55%, var(--c) 78%, #F1F1F1 85%, var(--c) 92%, rgba(58,77,161,.55)); animation: spin 5s linear infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; filter: drop-shadow(0 0 5px rgba(107,181,228,.5)); }
    .kpi.bad::before { filter: drop-shadow(0 0 5px rgba(255,107,122,.5)); }
    .kpi::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .25s;
      background: radial-gradient(180px circle at var(--mx) var(--my), color-mix(in srgb, var(--c) 26%, transparent), transparent 70%); }
    .kpi:hover::after { opacity: 1; }
    @keyframes spin { to { --a: 360deg; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; } }
    @keyframes alarm { 50% { box-shadow: 0 0 22px rgba(255,107,122,.4); } }
    .kpi .k { font: 600 10.5px var(--font); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; padding-right: 58px; min-height: 28px; }
    .kpi .gauge { position: absolute; right: 6px; top: 6px; width: 56px; height: 56px; }
    .gauge .track { stroke: rgba(241,241,241,.1); } .gauge .arc { stroke: var(--c); filter: drop-shadow(0 0 4px var(--c)); stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .25s; }
    .gauge.on .arc { stroke-dashoffset: var(--off); } .gauge text { fill: var(--c); font: 700 12px var(--font); text-anchor: middle; }
    .kpi .vals { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .kpi .vals .a { color: var(--dim); font-size: 14px; } .kpi .vals .arrow { color: var(--faint); }
    .kpi .vals .b { color: var(--sky); font-size: 27px; font-weight: 700; letter-spacing: -.02em; text-shadow: 0 0 14px rgba(107,181,228,.4); }
    .kpi.bad .vals .b { color: var(--red); text-shadow: 0 0 14px rgba(255,107,122,.35); }
    .kpi .bars { display: grid; gap: 4px; }
    .kpi .bars i { display: block; height: 5px; border-radius: 3px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .3s; }
    .kpi .bars i.ra { background: var(--royal); } .kpi .bars i.rb { background: var(--sky); box-shadow: 0 0 8px rgba(107,181,228,.55); } .kpi.bad .bars i.rb { background: var(--red); box-shadow: 0 0 8px rgba(255,107,122,.5); }
    .kpi.on .bars i { width: var(--w); }
    .kpi .d { font-size: 12px; margin-top: 8px; color: var(--dim); } .kpi.good .d { color: var(--ink); } .kpi.bad .d { color: var(--red); font-weight: 700; }

    /* ---- charts ---- */
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
    .chart { position: relative; border-radius: 14px; padding: 12px 12px 6px; cursor: zoom-in; border: 1.5px solid transparent;
      background: linear-gradient(rgba(30,30,30,.85), rgba(30,30,30,.85)) padding-box, linear-gradient(135deg, rgba(107,181,228,.55), rgba(58,77,161,.35) 60%, rgba(107,181,228,.55)) border-box;
      transition: box-shadow .25s; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .chart:nth-child(2) { animation-delay: .08s; } .chart:nth-child(3) { animation-delay: .16s; } .chart:nth-child(4) { animation-delay: .24s; }
    .chart:hover { box-shadow: 0 0 0 1px rgba(107,181,228,.4), 0 12px 30px -12px rgba(107,181,228,.6); }
    .chart h3 { font: 700 12px var(--font); color: var(--ink); margin: 0 4px 4px; letter-spacing: .04em; display: flex; gap: 8px; align-items: center; }
    .chart h3::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--sky); box-shadow: 0 0 6px var(--sky); flex: none; }
    .chart text { font-family: var(--font); }
    svg { width: 100%; height: auto; display: block; }
    .chart path.line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.7s cubic-bezier(.3,.7,.2,1) .2s forwards; filter: drop-shadow(0 0 3px currentColor); }
    .chart path.area { opacity: 0; animation: fade 1s ease 1.2s forwards; }
    .chart rect.bar { transform-box: fill-box; transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) .15s both; }
    @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes fade { to { opacity: 1; } } @keyframes grow { from { transform: scaleY(0); } }
    .legend { font-size: 12px; color: var(--dim); display: flex; gap: 16px; margin: 12px 4px 0; }
    .legend i { display: inline-block; width: 16px; height: 3px; border-radius: 3px; margin-right: 7px; vertical-align: 3px; }

    /* ---- tables: Metric | RIP | RIP-X | Change, with log-style [ OK ] / WARN tags ---- */
    .tablewrap { overflow-x: auto; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(58,77,161,.45); }
    th { color: var(--sky); font: 700 11px var(--font); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    tbody tr { transition: background .15s; } tbody tr:hover { background: rgba(58,77,161,.2); }
    td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
    table.grid { table-layout: fixed; min-width: 640px; font-variant-numeric: tabular-nums; }
    table.grid th:first-child, table.grid td.m { width: 44%; white-space: nowrap; color: var(--ink); }
    table.grid .v { text-align: right; white-space: nowrap; }
    table.grid td.v b { display: block; font-size: 15px; font-weight: 700; color: var(--ink); }
    table.grid td.v small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 1px; }
    table.grid td.chg b { text-shadow: 0 0 10px currentColor; }
    table.grid td.chg.good b { color: var(--sky); } table.grid td.chg.bad b { color: var(--red); } table.grid td.chg.flat b { color: var(--dim); text-shadow: none; }
    table.grid td.chg.bad { background: rgba(255,107,122,.08); }
    .tag { display: inline-block; min-width: 58px; margin-right: 8px; font-weight: 700; font-size: 11.5px; color: var(--dim); } .tag.ok { color: var(--sky); } .tag.warn { color: var(--red); }
    h3.sub { margin: 18px 0 6px; font: 700 12px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
    details.abl { margin-top: 14px; } details.abl summary { cursor: pointer; font: 600 12px var(--font); color: var(--dim); padding: 6px 0; } details.abl summary:hover { color: var(--sky); }
    .note { font-size: 12.5px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
    .good { color: var(--ink); } .bad { color: var(--red); } .flat { color: var(--dim); }
    .err { color: var(--red); font-size: 13px; }

    /* ---- chart zoom overlay ---- */
    #zoom { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 4vh 4vw; background: rgba(10,10,10,.78); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .22s; }
    #zoom.open { opacity: 1; pointer-events: auto; }
    #zoom .chart { width: min(1000px, 92vw); padding: 18px 20px 14px; cursor: default; animation: none; transform: scale(.92); transition: transform .28s cubic-bezier(.2,.9,.3,1.2);
      background: linear-gradient(#1E1E1E, #1E1E1E) padding-box, linear-gradient(135deg, var(--sky), var(--royal)) border-box; box-shadow: 0 0 40px rgba(107,181,228,.35); }
    #zoom.open .chart { transform: scale(1); }
    #zoom .chart h3 { font-size: 15px; } #zoom .chart:hover { transform: scale(1); }
    #zoom .hintkey { font: 500 11px var(--font); color: var(--dim); letter-spacing: .1em; text-align: right; margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .kpi { opacity: 1; transform: none !important; } .glitch::before, .glitch::after { display: none; } .cursor { animation: none !important; }
      .gauge .arc { stroke-dashoffset: var(--off); } .kpi .bars i { width: var(--w); } .chart path.line { stroke-dashoffset: 0; } .chart path.area { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <h1><span class="glitch" data-t="RIP-X Dashboard">RIP-X Dashboard</span><span class="cursor"></span><span class="engine" id="engine"></span></h1>
    <a href="index.html">← Live network simulator</a>
  </nav>

  <section id="cmp">
    <h2>1. Failure recovery: RIP vs RIP-X</h2>
    <div class="row">
      <label>Routers <input type="number" id="cmpRouters" value="16" min="6" max="40"></label>
      <label>Seed <input type="number" id="cmpSeed" value="0" min="0"></label>
      <button class="go" id="cmpGo">Run comparison</button>
      <span class="err" id="cmpErr"></span>
    </div>
    <div class="cards" id="cmpCards"></div>
    <div class="charts" id="cmpCharts"></div>
    <div class="legend"><span><i style="background:#3A4DA1;color:#3A4DA1"></i>Standard RIP</span><span><i style="background:#6BB5E4;color:#6BB5E4"></i>RIP-X</span></div>
  </section>

  <section id="te">
    <h2>2. Traffic engineering</h2>
    <div class="row">
      <label>Seed <input type="number" id="teSeed" value="0" min="0"></label>
      <button class="go" id="teGo">Run traffic engineering</button>
      <span class="err" id="teErr"></span>
    </div>
    <div class="cards" id="teCards"></div>
    <table id="teTable" hidden><thead><tr><th>Epoch</th><th>Delivered (Mbps)</th><th>Peak utilization</th><th>Links made costlier</th><th>Control msgs</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="bm">
    <h2>3. Benchmark (many seeds, with confidence intervals)</h2>
    <div class="row">
      <label>Seeds <input type="number" id="bmSeeds" value="5" min="2" max="30"></label>
      <button class="go" id="bmGo">Run benchmark</button>
      <span id="bmStatus" class="flat"></span>
    </div>
    <div id="bmBody"></div>
  </section>
</div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Zoomed chart"></div>
<script src="dashboard.js"></script>
</body>
</html>
