<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIP-X Dashboard | RIP vs RIP-X</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <style>
    /* ---- cyberpunk neon theme (plain CSS, no dependencies) ---- */
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root {
      --bg: #06020f; --panel: rgba(16, 6, 36, .82); --ink: #e9e6ff; --mute: #9d8fc7; --dim: #6b5f94;
      --cy: #00f0ff; --mg: #ff2bd6; --lime: #9dff3c; --amber: #ffb400; --red: #ff3b6b;
      --cyber: 'Chakra Petch', 'Rajdhani', 'Bahnschrift', 'Segoe UI', sans-serif;
      --glow-cy: 0 0 8px rgba(0,240,255,.65), 0 0 22px rgba(0,240,255,.35);
      --glow-mg: 0 0 8px rgba(255,43,214,.65), 0 0 22px rgba(255,43,214,.3);
    }
    body { overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
    /* perspective neon grid + scanlines + vignette, fixed behind everything */
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255,43,214,.22), transparent 55%),
        radial-gradient(ellipse at 90% 100%, rgba(0,240,255,.16), transparent 50%),
        linear-gradient(rgba(0,240,255,.07) 1px, transparent 1px) 0 0 / 100% 46px,
        linear-gradient(90deg, rgba(255,43,214,.07) 1px, transparent 1px) 0 0 / 46px 100%; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
    nav { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    nav h1 { font-size: 22px; flex: 1; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
    nav a { color: var(--cy); text-decoration: none; font-size: 13px; text-shadow: var(--glow-cy); }
    .engine { font-size: 11px; color: var(--lime); letter-spacing: .08em; text-shadow: 0 0 8px rgba(157,255,60,.6); }
    /* glitch title */
    .glitch { position: relative; color: #fff; text-shadow: var(--glow-mg); }
    .glitch::before, .glitch::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; }
    .glitch::before { color: var(--cy); transform: translate(-2px, 0); clip-path: inset(0 0 60% 0); animation: glitch 3.6s steps(1) infinite; }
    .glitch::after { color: var(--mg); transform: translate(2px, 0); clip-path: inset(60% 0 0 0); animation: glitch 3.6s steps(1) infinite reverse; }
    @keyframes glitch { 0%,90%,100% { opacity: 0; } 91% { opacity: .9; transform: translate(-3px,1px); } 93% { opacity: .9; transform: translate(3px,-1px); } 95% { opacity: 0; } }
    section { position: relative; background: var(--panel); border: 1px solid rgba(255,43,214,.28); border-radius: 14px; padding: 18px; margin-bottom: 18px;
      box-shadow: 0 0 0 1px rgba(0,240,255,.06) inset, 0 12px 40px -18px rgba(255,43,214,.45); backdrop-filter: blur(6px); }
    section h2 { font-family: var(--cyber); font-weight: 700; font-size: 16px; margin-bottom: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--cy); text-shadow: var(--glow-cy); }
    section p.hint { color: var(--mute); font-size: 13px; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    label { font: 600 11px var(--cyber); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: flex; gap: 8px; align-items: center; }
    .num { display: inline-flex; align-items: stretch; border-radius: 8px; background: linear-gradient(180deg, rgba(0,240,255,.09), rgba(0,240,255,.02));
      border: 1px solid rgba(0,240,255,.4); box-shadow: inset 0 0 12px rgba(0,240,255,.07); transition: box-shadow .2s, border-color .2s; overflow: hidden; }
    .num:hover { border-color: rgba(0,240,255,.75); }
    .num:focus-within { border-color: var(--cy); box-shadow: 0 0 0 1px var(--cy), 0 0 16px rgba(0,240,255,.55), inset 0 0 12px rgba(0,240,255,.12); }
    input[type=number] { width: 54px; background: transparent; color: #fff; border: 0; padding: 7px 4px; text-align: center; font: 700 15px var(--cyber); -moz-appearance: textfield; caret-color: var(--mg); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number]:focus { outline: none; text-shadow: 0 0 8px var(--cy); }
    .num button { width: 26px; background: transparent; border: 0; color: var(--cy); font: 700 15px var(--cyber); cursor: pointer; transition: background .15s, text-shadow .15s; }
    .num button:first-child { border-right: 1px solid rgba(0,240,255,.2); } .num button:last-child { border-left: 1px solid rgba(0,240,255,.2); }
    .num button:hover { background: rgba(255,43,214,.18); color: #fff; text-shadow: var(--glow-mg); }
    .num button:active { background: rgba(255,43,214,.35); }
    button.go { position: relative; background: linear-gradient(135deg, rgba(255,43,214,.9), rgba(120,40,255,.9)); color: #fff; border: 0; border-radius: 6px; padding: 9px 16px;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; cursor: pointer; box-shadow: var(--glow-mg); transition: transform .12s, box-shadow .2s; }
    button.go:hover { transform: translateY(-1px); box-shadow: 0 0 14px rgba(255,43,214,.9), 0 0 36px rgba(255,43,214,.5); }
    button.go:disabled { opacity: .45; cursor: wait; box-shadow: none; }
    /* ---- KPI tiles: animated conic neon border, pointer spotlight + tilt, count-up, gauge, before/after bars ---- */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 14px; margin-bottom: 16px; perspective: 900px; }
    .kpi { --c: var(--cy); --mx: 50%; --my: 0%; --rx: 0deg; --ry: 0deg; position: relative; padding: 13px 14px 12px; border-radius: 12px; isolation: isolate;
      background: linear-gradient(160deg, rgba(20,8,44,.95), rgba(8,3,22,.95)); transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d;
      transition: transform .18s ease-out; animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i, 0) * 70ms); }
    .kpi.good { --c: var(--lime); } .kpi.bad { --c: var(--red); } .kpi.flat { --c: var(--cy); }
    .kpi::before { content: ""; position: absolute; inset: -1.5px; z-index: -1; border-radius: 13px; padding: 1.5px;
      background: conic-gradient(from var(--a), transparent 0 55%, var(--c) 78%, #fff 85%, var(--c) 92%, transparent); animation: spin 5s linear infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; filter: drop-shadow(0 0 6px var(--c)); }
    .kpi::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px; pointer-events: none; opacity: .0; transition: opacity .25s;
      background: radial-gradient(180px circle at var(--mx) var(--my), color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
    .kpi:hover::after { opacity: 1; }
    .kpi.bad { animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both, alarm 2.2s ease-in-out 1s infinite; animation-delay: calc(var(--i, 0) * 70ms), 1s; }
    @keyframes spin { to { --a: 360deg; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; } }
    @keyframes alarm { 50% { box-shadow: 0 0 22px rgba(255,59,107,.45); } }
    .kpi .k { font-family: var(--cyber); font-weight: 500; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .1em; padding-right: 58px; min-height: 26px; }
    .kpi .gauge { position: absolute; right: 6px; top: 6px; width: 56px; height: 56px; }
    .gauge .track { stroke: rgba(255,255,255,.08); } .gauge .arc { stroke: var(--c); filter: drop-shadow(0 0 4px var(--c)); stroke-dasharray: 1; stroke-dashoffset: 1;
      transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .25s; } .gauge.on .arc { stroke-dashoffset: var(--off); }
    .gauge text { fill: var(--c); font: 700 12px var(--cyber); text-anchor: middle; }
    .kpi .vals { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 8px; font-family: var(--cyber); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .kpi .vals .a { color: var(--amber); font-size: 15px; opacity: .9; } .kpi .vals .arrow { color: var(--dim); }
    .kpi .vals .b { color: #fff; font-size: 27px; font-weight: 700; text-shadow: 0 0 12px var(--c); }
    .kpi .bars { display: grid; gap: 4px; }
    .kpi .bars i { display: block; height: 5px; border-radius: 3px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .3s; }
    .kpi .bars i.ra { background: var(--amber); box-shadow: 0 0 8px var(--amber); } .kpi .bars i.rb { background: var(--cy); box-shadow: var(--glow-cy); }
    .kpi.on .bars i { width: var(--w); }
    .kpi .d { font-size: 11.5px; margin-top: 8px; color: var(--mute); }
    .kpi.good .d { color: var(--lime); } .kpi.bad .d { color: var(--red); text-shadow: 0 0 8px rgba(255,59,107,.6); }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
    .chart { background: rgba(8,3,22,.7); border: 1px solid rgba(0,240,255,.14); border-radius: 10px; padding: 8px; }
    .chart h3 { font: 600 12.5px var(--cyber); color: var(--ink); margin: 2px 4px 4px; letter-spacing: .06em; text-transform: uppercase; }
    .chart text { font-family: var(--cyber); }
    svg { width: 100%; height: auto; display: block; }
    .chart path.line { filter: drop-shadow(0 0 3px currentColor); stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .legend { font-family: var(--cyber); letter-spacing: .05em; font-size: 12px; color: var(--mute); display: flex; gap: 14px; margin: 8px 4px 0; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; box-shadow: 0 0 8px currentColor; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(0,240,255,.14); }
    th { color: var(--cy); font-weight: 600; letter-spacing: .04em; }
    tbody tr:hover { background: rgba(255,43,214,.07); }
    td.num { font-family: var(--cyber); white-space: nowrap; }
    .note { font-size: 12.5px; color: var(--mute); margin-top: 10px; line-height: 1.5; }
    .good { color: var(--lime); } .bad { color: var(--red); } .flat { color: var(--mute); }
    .err { color: var(--red); font-size: 13px; }
    /* ---- chart zoom overlay ---- */
    .chart { cursor: zoom-in; }
    #zoom { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 4vh 4vw; background: rgba(4,1,12,.78); backdrop-filter: blur(5px);
      opacity: 0; pointer-events: none; transition: opacity .22s; }
    #zoom.open { opacity: 1; pointer-events: auto; }
    #zoom .chart { width: min(1000px, 92vw); padding: 18px 20px 14px; cursor: default; border-color: var(--cy); animation: none; transform: scale(.92); transition: transform .28s cubic-bezier(.2,.9,.3,1.2);
      box-shadow: 0 0 0 1px var(--cy), 0 0 40px rgba(0,240,255,.35), 0 0 120px rgba(255,43,214,.2); background: rgba(8,3,22,.96); }
    #zoom.open .chart { transform: scale(1); }
    #zoom .chart h3 { font-size: 15px; } #zoom .chart:hover { transform: scale(1); }
    #zoom .hintkey { font: 500 11px var(--cyber); color: var(--dim); letter-spacing: .1em; text-align: right; margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .kpi { opacity: 1; transform: none !important; } .glitch::before, .glitch::after { display: none; }
      .gauge .arc { stroke-dashoffset: var(--off); } .kpi .bars i { width: var(--w); } .chart path.line { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <h1><span class="glitch" data-t="RIP-X Dashboard">RIP-X Dashboard</span><span class="engine" id="engine"></span></h1>
    <a href="index.html">← Live network simulator</a>
  </nav>

  <section id="cmp">
    <h2>1. Failure recovery: RIP vs RIP-X</h2>
    <div class="row">
      <label>Routers <input type="number" id="cmpRouters" value="16" min="6" max="40"></label>
      <label>Seed <input type="number" id="cmpSeed" value="0" min="0"></label>
      <button class="go" id="cmpGo">Run comparison</button>
      <span class="err" id="cmpErr"></span>
    </div>
    <div class="cards" id="cmpCards"></div>
    <div class="charts" id="cmpCharts"></div>
    <div class="legend"><span><i style="background:#ffb400;color:#ffb400"></i>Standard RIP</span><span><i style="background:#00f0ff;color:#00f0ff"></i>RIP-X</span></div>
  </section>

  <section id="te">
    <h2>2. Traffic engineering</h2>
    <div class="row">
      <label>Seed <input type="number" id="teSeed" value="0" min="0"></label>
      <button class="go" id="teGo">Run traffic engineering</button>
      <span class="err" id="teErr"></span>
    </div>
    <div class="cards" id="teCards"></div>
    <table id="teTable" hidden><thead><tr><th>Epoch</th><th>Delivered (Mbps)</th><th>Peak utilization</th><th>Links made costlier</th><th>Control msgs</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="bm">
    <h2>3. Benchmark (many seeds, with confidence intervals)</h2>
    <div class="row">
      <label>Seeds <input type="number" id="bmSeeds" value="5" min="2" max="30"></label>
      <button class="go" id="bmGo">Run benchmark</button>
      <span id="bmStatus" class="flat"></span>
    </div>
    <div id="bmBody"></div>
  </section>
</div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Zoomed chart"></div>
<script src="dashboard.js"></script>
</body>
</html>
