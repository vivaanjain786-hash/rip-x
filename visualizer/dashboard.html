<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIP-X Dashboard | RIP vs RIP-X</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" media="print" onload="this.media='all'">
  <style>
    /* ---- gothic cyberpunk theme (plain CSS, no dependencies) ---- */
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root {
      --bg: #0B0C10; --panel: rgba(14,12,20, .82); --ink: #F5F5F5; --mute: #a9a4b8; --dim: #6f6a82;
      --cy: #39FF14; --mg: #8f3fd6; --purple: #4B0082; --lime: #39FF14; --amber: #F5F5F5; --red: #ff3b6b;
      --gothic: 'UnifrakturCook', 'UnifrakturMaguntia', 'Old English Text MT', Georgia, serif;
      --cyber: 'Chakra Petch', 'Rajdhani', 'Bahnschrift', 'Segoe UI', sans-serif;
      --glow-cy: 0 0 8px rgba(57,255,20,.65), 0 0 22px rgba(57,255,20,.35);
      --glow-mg: 0 0 8px rgba(143,63,214,.65), 0 0 22px rgba(143,63,214,.3);
    }
    body { overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
    /* obsidian backdrop: drifting purple fog + faint dot matrix; vignette on top */
    body::before { content: ""; position: fixed; inset: -8%; z-index: -2; pointer-events: none; animation: fog 32s ease-in-out infinite alternate;
      background: radial-gradient(ellipse 60% 38% at 18% 104%, rgba(75,0,130,.6), transparent 70%), radial-gradient(ellipse 55% 34% at 88% 100%, rgba(75,0,130,.42), transparent 70%),
                  radial-gradient(ellipse 75% 28% at 50% -4%, rgba(75,0,130,.38), transparent 70%), radial-gradient(rgba(57,255,20,.07) 1px, transparent 1.2px) 0 0 / 22px 22px, #0B0C10; }
    @keyframes fog { to { transform: translate(3%, -2.5%) scale(1.04); } }
    body::after { content: ""; position: fixed; inset: 0; z-index: 50; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(0,0,0,.72) 100%); }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
    nav { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    nav h1 { font: 700 38px/1.1 var(--gothic); flex: 1; letter-spacing: .01em; }
    nav h1::before { content: "†"; color: var(--cy); margin-right: 14px; font: 700 26px Georgia, serif; vertical-align: 5px; }
    nav a { color: var(--cy); text-decoration: none; font-size: 13px; text-shadow: var(--glow-cy); }
    .engine { font-size: 11px; color: var(--lime); letter-spacing: .08em; text-shadow: 0 0 8px rgba(57,255,20,.6); }
    /* glitch title */
    .glitch { position: relative; color: #fff; text-shadow: var(--glow-mg); }
    .glitch::before, .glitch::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; }
    .glitch::before { color: var(--cy); transform: translate(-2px, 0); clip-path: inset(0 0 60% 0); animation: glitch 3.6s steps(1) infinite; }
    .glitch::after { color: var(--mg); transform: translate(2px, 0); clip-path: inset(60% 0 0 0); animation: glitch 3.6s steps(1) infinite reverse; }
    @keyframes glitch { 0%,90%,100% { opacity: 0; } 91% { opacity: .9; transform: translate(-3px,1px); } 93% { opacity: .9; transform: translate(3px,-1px); } 95% { opacity: 0; } }
    /* ---- HUD panels: hard edges, chamfered corners, 1px neon edge drawn as an under-layer, corner brackets ---- */
    :root { --cut: 14px; --poly: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
            --poly-in: polygon(0 0, calc(100% - var(--cut) + .6px) 0, 100% calc(var(--cut) - .6px), 100% 100%, calc(var(--cut) - .6px) 100%, 0 calc(100% - var(--cut) + .6px)); }
    section, .kpi, .chart { position: relative; isolation: isolate; border: 0; border-radius: 0; clip-path: var(--poly); }
    section::before, .kpi::before, .chart::before { content: ""; position: absolute; inset: 1px; z-index: -1; background: var(--fill); clip-path: var(--poly-in); animation: none; filter: none; border-radius: 0; padding: 0; -webkit-mask: none; mask: none; }
    section { --cut: 22px; --fill: #0d0b14; background: linear-gradient(135deg, rgba(57,255,20,.75), rgba(143,63,214,.6)); padding: 20px; margin-bottom: 26px; box-shadow: none; backdrop-filter: none; }
    section::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; --b: var(--mg);
      background: linear-gradient(var(--b), var(--b)) 0 0 / 18px 3px no-repeat, linear-gradient(var(--b), var(--b)) 0 0 / 3px 18px no-repeat,
                  linear-gradient(var(--b), var(--b)) 100% 100% / 18px 3px no-repeat, linear-gradient(var(--b), var(--b)) 100% 100% / 3px 18px no-repeat; }
    section h2 { display: flex; align-items: center; gap: 12px; text-shadow: none; }
    section h2::before { content: "†"; color: var(--cy); font: 700 20px Georgia, serif; flex: none; }
    section h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(57,255,20,.7), transparent); }

    section h2 { font-family: var(--gothic); font-weight: 700; font-size: 26px; line-height: 1.1; margin-bottom: 14px; letter-spacing: .01em; color: var(--ink); }
    section p.hint { color: var(--mute); font-size: 13px; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    label { font: 600 11px var(--cyber); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: flex; gap: 8px; align-items: center; }
    .stepper { display: inline-flex; align-items: stretch; border-radius: 0; background: linear-gradient(180deg, rgba(57,255,20,.09), rgba(57,255,20,.02));
      border: 1px solid rgba(57,255,20,.4); box-shadow: inset 0 0 12px rgba(57,255,20,.07); transition: box-shadow .2s, border-color .2s; overflow: hidden; }
    .stepper:hover { border-color: rgba(57,255,20,.75); }
    .stepper:focus-within { border-color: var(--cy); box-shadow: 0 0 0 1px var(--cy), 0 0 16px rgba(57,255,20,.55), inset 0 0 12px rgba(57,255,20,.12); }
    input[type=number] { width: 54px; background: transparent; color: #fff; border: 0; padding: 7px 4px; text-align: center; font: 700 15px var(--cyber); -moz-appearance: textfield; caret-color: var(--mg); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number]:focus { outline: none; text-shadow: 0 0 8px var(--cy); }
    .stepper button { width: 26px; background: transparent; border: 0; color: var(--cy); font: 700 15px var(--cyber); cursor: pointer; transition: background .15s, text-shadow .15s; }
    .stepper button:first-child { border-right: 1px solid rgba(57,255,20,.2); } .num button:last-child { border-left: 1px solid rgba(57,255,20,.2); }
    .stepper button:hover { background: rgba(143,63,214,.18); color: #fff; text-shadow: var(--glow-mg); }
    .stepper button:active { background: rgba(143,63,214,.35); }
    button.go { position: relative; background: linear-gradient(135deg, #5a0fa0, #4B0082); color: #F5F5F5; border: 0; border-radius: 0; padding: 10px 20px; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; cursor: pointer; transition: transform .12s, filter .2s; }
    button.go:hover { transform: translateY(-1px); filter: brightness(1.25) saturate(1.2); }
    button.go:disabled { opacity: .45; cursor: wait; filter: none; }
    /* ---- KPI tiles: animated conic neon border, pointer spotlight + tilt, count-up, gauge, before/after bars ---- */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 14px; margin-bottom: 16px; perspective: 900px; }
    .kpi { --c: var(--cy); --cut: 12px; --fill: #110d1a; --mx: 50%; --my: 0%; --rx: 0deg; --ry: 0deg; padding: 14px 15px 12px; transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d;
      background: linear-gradient(105deg, color-mix(in srgb, var(--c) 55%, transparent) 0 42%, #fff 50%, color-mix(in srgb, var(--c) 55%, transparent) 58% 100%) 100% 0 / 300% 100%;
      transition: transform .18s ease-out; animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both, glint 5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 70ms), calc(var(--i, 0) * 400ms + 1s); }
    .kpi.good { --c: var(--lime); } .kpi.bad { --c: var(--red); } .kpi.flat { --c: var(--cy); }
    .kpi::after { content: ""; position: absolute; inset: 1px; z-index: -1; clip-path: var(--poly-in); pointer-events: none; opacity: .0; transition: opacity .25s;
      background: radial-gradient(180px circle at var(--mx) var(--my), color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
    .kpi:hover::after { opacity: 1; }
    .kpi.bad { animation-duration: .55s, 1.6s; }
    @keyframes glint { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; } }
    .kpi .k { font-family: var(--cyber); font-weight: 500; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .1em; padding-right: 58px; min-height: 26px; }
    .kpi .gauge { position: absolute; right: 6px; top: 6px; width: 56px; height: 56px; }
    .gauge .track { stroke: rgba(255,255,255,.08); } .gauge .arc { stroke: var(--c); filter: drop-shadow(0 0 4px var(--c)); stroke-dasharray: 1; stroke-dashoffset: 1;
      transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .25s; } .gauge.on .arc { stroke-dashoffset: var(--off); }
    .gauge text { fill: var(--c); font: 700 12px var(--cyber); text-anchor: middle; }
    .kpi .vals { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 8px; font-family: var(--cyber); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .kpi .vals .a { color: var(--amber); font-size: 15px; opacity: .9; } .kpi .vals .arrow { color: var(--dim); }
    .kpi .vals .b { color: #fff; font-size: 27px; font-weight: 700; text-shadow: 0 0 12px var(--c); }
    .kpi .bars { display: grid; gap: 4px; }
    .kpi .bars i { display: block; height: 5px; border-radius: 3px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .3s; }
    .kpi .bars i.ra { background: var(--amber); box-shadow: 0 0 8px var(--amber); } .kpi .bars i.rb { background: var(--cy); box-shadow: var(--glow-cy); }
    .kpi.on .bars i { width: var(--w); }
    .kpi .d { font-size: 11.5px; margin-top: 8px; color: var(--mute); }
    .kpi.good .d { color: var(--lime); } .kpi.bad .d { color: var(--red); text-shadow: 0 0 8px rgba(255,59,107,.6); }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
    .chart { --cut: 12px; --fill: #0c0a12; background: linear-gradient(135deg, rgba(57,255,20,.45), rgba(57,255,20,.12) 60%, rgba(143,63,214,.4)); padding: 10px; transition: background .25s; }
    .chart:hover { background: linear-gradient(135deg, var(--cy), rgba(57,255,20,.4) 60%, var(--mg)); }
    .chart h3 { font: 600 12.5px var(--cyber); color: var(--ink); margin: 2px 4px 4px; letter-spacing: .06em; text-transform: uppercase; }
    .chart text { font-family: var(--cyber); }
    svg { width: 100%; height: auto; display: block; }
    .chart path.line { filter: drop-shadow(0 0 3px currentColor); stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .legend { font-family: var(--cyber); letter-spacing: .05em; font-size: 12px; color: var(--mute); display: flex; gap: 14px; margin: 8px 4px 0; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; box-shadow: 0 0 8px currentColor; }
    .tablewrap { overflow-x: auto; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(57,255,20,.12); }
    th { color: var(--cy); font: 600 11px var(--cyber); letter-spacing: .1em; text-transform: uppercase; text-shadow: var(--glow-cy); white-space: nowrap; }
    tbody tr { transition: background .15s; } tbody tr:hover { background: rgba(143,63,214,.08); }
    td.num { font-family: var(--cyber); white-space: nowrap; font-variant-numeric: tabular-nums; }
    table.grid { table-layout: fixed; min-width: 560px; }
    table.grid th:first-child, table.grid td.m { width: 34%; white-space: nowrap; color: var(--ink); }
    table.grid .v { text-align: right; white-space: nowrap; font-family: var(--cyber); font-variant-numeric: tabular-nums; }
    table.grid td.v b { display: block; font-size: 15px; font-weight: 600; color: #fff; }
    table.grid td.v small { display: block; font-size: 10.5px; color: var(--dim); margin-top: 1px; }
    table.grid td.chg b { text-shadow: 0 0 10px currentColor; }
    table.grid td.chg.good b { color: var(--lime); } table.grid td.chg.bad b { color: var(--red); } table.grid td.chg.flat b { color: var(--mute); text-shadow: none; }
    h3.sub { margin: 18px 0 6px; font: 600 12px var(--cyber); letter-spacing: .1em; text-transform: uppercase; color: var(--mg); }
    details.abl { margin-top: 14px; } details.abl summary { cursor: pointer; font: 600 12px var(--cyber); letter-spacing: .08em; color: var(--mute); padding: 6px 0; }
    details.abl summary:hover { color: var(--cy); }
    .note { font-size: 12.5px; color: var(--mute); margin-top: 10px; line-height: 1.5; }
    .good { color: var(--lime); } .bad { color: var(--red); } .flat { color: var(--mute); }
    .err { color: var(--red); font-size: 13px; }
    /* ---- chart zoom overlay ---- */
    .chart { cursor: zoom-in; }
    #zoom { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 4vh 4vw; background: rgba(11,12,16,.78); backdrop-filter: blur(5px);
      opacity: 0; pointer-events: none; transition: opacity .22s; }
    #zoom.open { opacity: 1; pointer-events: auto; }
    #zoom .chart { width: min(1000px, 92vw); padding: 18px 20px 14px; --cut: 20px; --fill: #08070c; cursor: default; background: linear-gradient(135deg, var(--cy), var(--mg)); animation: none; transform: scale(.92); transition: transform .28s cubic-bezier(.2,.9,.3,1.2);
      }
    #zoom.open .chart { transform: scale(1); }
    #zoom .chart h3 { font-size: 15px; } #zoom .chart:hover { transform: scale(1); }
    #zoom .hintkey { font: 500 11px var(--cyber); color: var(--dim); letter-spacing: .1em; text-align: right; margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .kpi { opacity: 1; transform: none !important; } .glitch::before, .glitch::after { display: none; }
      .gauge .arc { stroke-dashoffset: var(--off); } .kpi .bars i { width: var(--w); } .chart path.line { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <h1><span class="glitch" data-t="RIP-X Dashboard">RIP-X Dashboard</span><span class="engine" id="engine"></span></h1>
    <a href="index.html">← Live network simulator</a>
  </nav>

  <section id="cmp">
    <h2>1. Failure recovery: RIP vs RIP-X</h2>
    <div class="row">
      <label>Routers <input type="number" id="cmpRouters" value="16" min="6" max="40"></label>
      <label>Seed <input type="number" id="cmpSeed" value="0" min="0"></label>
      <button class="go" id="cmpGo">Run comparison</button>
      <span class="err" id="cmpErr"></span>
    </div>
    <div class="cards" id="cmpCards"></div>
    <div class="charts" id="cmpCharts"></div>
    <div class="legend"><span><i style="background:#F5F5F5;color:#F5F5F5"></i>Standard RIP</span><span><i style="background:#39FF14;color:#39FF14"></i>RIP-X</span></div>
  </section>

  <section id="te">
    <h2>2. Traffic engineering</h2>
    <div class="row">
      <label>Seed <input type="number" id="teSeed" value="0" min="0"></label>
      <button class="go" id="teGo">Run traffic engineering</button>
      <span class="err" id="teErr"></span>
    </div>
    <div class="cards" id="teCards"></div>
    <table id="teTable" hidden><thead><tr><th>Epoch</th><th>Delivered (Mbps)</th><th>Peak utilization</th><th>Links made costlier</th><th>Control msgs</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="bm">
    <h2>3. Benchmark (many seeds, with confidence intervals)</h2>
    <div class="row">
      <label>Seeds <input type="number" id="bmSeeds" value="5" min="2" max="30"></label>
      <button class="go" id="bmGo">Run benchmark</button>
      <span id="bmStatus" class="flat"></span>
    </div>
    <div id="bmBody"></div>
  </section>
</div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="Zoomed chart"></div>
<script src="dashboard.js"></script>
</body>
</html>
