[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rip-x"
version = "0.1.0"
description = "Reproducible RIP distance-vector routing simulator"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40"]
viz = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

